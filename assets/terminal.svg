<svg viewBox="0 0 680 316" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Animated terminal showing portfolio project in development">
  <defs>
    <filter id="winGlow">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- scanline pattern inside terminal -->
    <pattern id="scan" width="680" height="3" patternUnits="userSpaceOnUse">
      <rect width="680" height="1" fill="#000" opacity="0.06"/>
    </pattern>
  </defs>

  <!-- outer glow halo -->
  <rect x="2" y="2" width="676" height="312" rx="11" fill="none" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.12" filter="url(#winGlow)"/>

  <!-- window body -->
  <rect width="680" height="316" fill="#0C0C0E" rx="10"/>

  <!-- scanlines overlay -->
  <rect width="680" height="316" fill="url(#scan)" rx="10"/>

  <!-- title bar -->
  <rect width="680" height="36" fill="#161618" rx="10"/>
  <rect x="0" y="18" width="680" height="18" fill="#161618"/>

  <!-- traffic lights -->
  <circle cx="20" cy="18" r="5.5" fill="#FF5F57"/>
  <circle cx="38" cy="18" r="5.5" fill="#FFBD2E"/>
  <circle cx="56" cy="18" r="5.5" fill="#28CA41"/>

  <!-- title text -->
  <text x="340" y="22" text-anchor="middle" font-family="'SFMono-Regular',Consolas,Menlo,monospace" font-size="10.5" fill="#3F3F46">portfolio · rudra@dev · ~/portfolio</text>

  <!-- separator -->
  <line x1="0" y1="36" x2="680" y2="36" stroke="#222226" stroke-width="1"/>

  <!-- ── TERMINAL LINES (each fades in with a delay) ────────────────────── -->

  <!-- 1. $ whoami -->
  <text x="18" y="64" font-family="'SFMono-Regular',Consolas,Menlo,monospace" font-size="12.5" opacity="0">
    <tspan fill="#4ADE80">❯ </tspan><tspan fill="#E2E8F0">whoami</tspan>
    <animate attributeName="opacity" from="0" to="1" begin="0.4s" dur="0.05s" fill="freeze"/>
  </text>

  <!-- 2. output: rudra-chintalwar -->
  <text x="18" y="82" font-family="'SFMono-Regular',Consolas,Menlo,monospace" font-size="12.5" fill="#A1A1AA" opacity="0">
    rudra-chintalwar
    <animate attributeName="opacity" from="0" to="1" begin="1.0s" dur="0.05s" fill="freeze"/>
  </text>

  <!-- 3. $ cat currently-building.txt -->
  <text x="18" y="108" font-family="'SFMono-Regular',Consolas,Menlo,monospace" font-size="12.5" opacity="0">
    <tspan fill="#4ADE80">❯ </tspan><tspan fill="#E2E8F0">cat currently-building.txt</tspan>
    <animate attributeName="opacity" from="0" to="1" begin="1.5s" dur="0.05s" fill="freeze"/>
  </text>

  <!-- 4. output: portfolio description -->
  <text x="18" y="126" font-family="'SFMono-Regular',Consolas,Menlo,monospace" font-size="12.5" opacity="0">
    <tspan fill="#38BDF8">portfolio</tspan><tspan fill="#52525B"> — Next.js · Framer Motion · Vercel</tspan>
    <animate attributeName="opacity" from="0" to="1" begin="2.0s" dur="0.05s" fill="freeze"/>
  </text>

  <!-- 5. $ git log --oneline -3 -->
  <text x="18" y="152" font-family="'SFMono-Regular',Consolas,Menlo,monospace" font-size="12.5" opacity="0">
    <tspan fill="#4ADE80">❯ </tspan><tspan fill="#E2E8F0">git log --oneline -3</tspan>
    <animate attributeName="opacity" from="0" to="1" begin="2.5s" dur="0.05s" fill="freeze"/>
  </text>

  <!-- 6. commit 1 -->
  <text x="18" y="170" font-family="'SFMono-Regular',Consolas,Menlo,monospace" font-size="12" opacity="0">
    <tspan fill="#A855F7">a4f2e1d</tspan><tspan fill="#52525B"> feat: GitHub API live data integration</tspan>
    <animate attributeName="opacity" from="0" to="1" begin="3.0s" dur="0.05s" fill="freeze"/>
  </text>

  <!-- 7. commit 2 -->
  <text x="18" y="186" font-family="'SFMono-Regular',Consolas,Menlo,monospace" font-size="12" opacity="0">
    <tspan fill="#A855F7">b8c3f2a</tspan><tspan fill="#52525B"> feat: 3D project showcase cards</tspan>
    <animate attributeName="opacity" from="0" to="1" begin="3.3s" dur="0.05s" fill="freeze"/>
  </text>

  <!-- 8. commit 3 -->
  <text x="18" y="202" font-family="'SFMono-Regular',Consolas,Menlo,monospace" font-size="12" opacity="0">
    <tspan fill="#A855F7">c9d4a1b</tspan><tspan fill="#52525B"> init: Next.js + Framer Motion + Vercel</tspan>
    <animate attributeName="opacity" from="0" to="1" begin="3.6s" dur="0.05s" fill="freeze"/>
  </text>

  <!-- 9. $ npm run dev -->
  <text x="18" y="228" font-family="'SFMono-Regular',Consolas,Menlo,monospace" font-size="12.5" opacity="0">
    <tspan fill="#4ADE80">❯ </tspan><tspan fill="#E2E8F0">npm run dev</tspan>
    <animate attributeName="opacity" from="0" to="1" begin="4.1s" dur="0.05s" fill="freeze"/>
  </text>

  <!-- 10. next.js banner line -->
  <text x="18" y="248" font-family="'SFMono-Regular',Consolas,Menlo,monospace" font-size="12" fill="#52525B" opacity="0">
    ▲ Next.js 14.2.0  –  local: http://localhost:3000
    <animate attributeName="opacity" from="0" to="1" begin="4.7s" dur="0.05s" fill="freeze"/>
  </text>

  <!-- 11. ✓ Ready -->
  <text x="18" y="266" font-family="'SFMono-Regular',Consolas,Menlo,monospace" font-size="12.5" opacity="0">
    <tspan fill="#22C55E">✓</tspan><tspan fill="#52525B"> compiled successfully  </tspan><tspan fill="#27272A">in 1.4s</tspan>
    <animate attributeName="opacity" from="0" to="1" begin="5.2s" dur="0.05s" fill="freeze"/>
  </text>

  <!-- 12. final prompt -->
  <text x="18" y="294" font-family="'SFMono-Regular',Consolas,Menlo,monospace" font-size="12.5" fill="#4ADE80" opacity="0">
    ❯
    <animate attributeName="opacity" from="0" to="1" begin="5.7s" dur="0.05s" fill="freeze"/>
  </text>

  <!-- blinking cursor -->
  <rect x="32" y="281" width="8" height="15" fill="#4ADE80" rx="1" opacity="0">
    <animate attributeName="opacity" values="0;1;0" begin="5.7s" dur="1.05s" repeatCount="indefinite"/>
  </rect>
</svg>
