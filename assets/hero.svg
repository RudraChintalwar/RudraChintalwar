<svg viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Rudra Chintalwar — Full-Stack Engineer, AI and Data Science">
  <defs>
    <!-- subtle dot grid -->
    <pattern id="dotgrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.8" fill="#1E1E1E"/>
    </pattern>
    <!-- cyan glow filter on name -->
    <filter id="glow" x="-5%" y="-30%" width="110%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- subtle line gradient overlay -->
    <linearGradient id="fadeLeft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0A0A0A" stop-opacity="0.9"/>
      <stop offset="20%" stop-color="#0A0A0A" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fadeRight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="80%" stop-color="#0A0A0A" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0A0A0A" stop-opacity="0.9"/>
    </linearGradient>
    <!-- accent glow for name -->
    <filter id="nameGlow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feColorMatrix in="blur" type="matrix"
        values="0 0 0 0 0.15
                0 0 0 0 0.8
                0 0 0 0 1
                0 0 0 0.6 0" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1200" height="300" fill="#0A0A0A"/>
  <!-- dot grid overlay -->
  <rect width="1200" height="300" fill="url(#dotgrid)" opacity="0.7"/>
  <!-- subtle left/right fades -->
  <rect width="1200" height="300" fill="url(#fadeLeft)"/>
  <rect width="1200" height="300" fill="url(#fadeRight)"/>

  <!-- accent line top -->
  <line x1="0" y1="2" x2="1200" y2="2" stroke="#27272A" stroke-width="1"/>
  <!-- accent line bottom -->
  <line x1="0" y1="298" x2="1200" y2="298" stroke="#27272A" stroke-width="1"/>

  <!-- corner coordinates -->
  <text x="24" y="30" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="10" letter-spacing="1.5" fill="#3F3F46">18.5204° N, 73.8567° E</text>
  <text x="1176" y="30" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="10" letter-spacing="1.5" fill="#3F3F46" text-anchor="end">PUNE, INDIA</text>

  <!-- status indicator — pulsing dot -->
  <circle cx="24" cy="60" r="4" fill="#22C55E" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.2;0.9" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="r" values="4;5.5;4" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="36" y="64" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="10" letter-spacing="2" fill="#4ADE80">SYSTEM.STATUS :: ACTIVE</text>

  <!-- decorative cyan accent bar left of name -->
  <rect x="22" y="90" width="3" height="80" rx="1.5" fill="#38BDF8" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.4;0.8" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- main title — with accent glow -->
  <text x="36" y="160" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="80" font-weight="700" letter-spacing="-2" fill="#F5F5F5" filter="url(#nameGlow)">RUDRA CHINTALWAR</text>

  <!-- subtitle with monospace style -->
  <text x="38" y="192" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="13" letter-spacing="4" fill="#71717A">FULL-STACK ENGINEER · AI &amp; DATA SCIENCE</text>

  <!-- blinking cursor after subtitle -->
  <rect x="622" y="178" width="10" height="16" fill="#38BDF8" rx="1">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- baseline separator -->
  <line x1="24" y1="218" x2="1176" y2="218" stroke="#1F1F23" stroke-width="1"/>

  <!-- moving scan line — subtle cyan tint -->
  <line x1="0" y1="0" x2="0" y2="300" stroke="#38BDF8" stroke-width="1" opacity="0.12">
    <animate attributeName="x1" values="-10;1210;-10" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="-10;1210;-10" dur="8s" repeatCount="indefinite"/>
  </line>

  <!-- footer labels -->
  <text x="24" y="258" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="10" letter-spacing="1.5" fill="#3F3F46">B.E. AI &amp; DS · PICT, PUNE</text>
  <text x="1176" y="258" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="10" letter-spacing="1.5" fill="#3F3F46" text-anchor="end">EST. 2027</text>

  <!-- tag line bottom -->
  <text x="24" y="278" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="10" letter-spacing="1.5" fill="#27272A">// building production software, ai systems, and developer-focused tools</text>
</svg>
